name: Lint

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  solhint-ethereum:
    name: Solhint - Ethereum contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ethereum

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '12'
          cache: 'npm'
          cache-dependency-path: ethereum/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run Solhint
        run: node_modules/.bin/solhint 'contracts/**/*.sol'

  solhint-evm-base-contracts:
    name: Solhint - EVM base contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: evm-base-contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '12'
          cache: 'npm'
          cache-dependency-path: evm-base-contracts/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run Solhint
        run: node_modules/.bin/solhint 'contracts/**/*.sol'
